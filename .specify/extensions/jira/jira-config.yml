# Jira Integration Configuration (spec-kit-jira v2.1.0)

# MCP Server Configuration
# Uses the Atlassian MCP already connected in Claude Code (server "plugin:atlassian:atlassian",
# tools named mcp__plugin_atlassian_atlassian__*). No API tokens are stored in this repo.
# The command docs reference generic tool names (project_get, field_list, issue_transition, ...);
# map them to the Atlassian MCP equivalents: createJiraIssue, editJiraIssue, getJiraIssue,
# searchJiraIssuesUsingJql, transitionJiraIssue, and discover/executeRead for anything else
# (listJiraProjectIssueTypesMetadata, getJiraIssueTypeMetaWithFields, listJiraIssueTransitions).
mcp_server: "atlassian"

# Atlassian site (pass cloud_id as cloudId on every Atlassian MCP call)
site:
  url: "https://strongtie.atlassian.net"
  cloud_id: "884a2ffd-d383-4f54-b2e1-c832058892bd"

# Jira Project Configuration
project:
  key: ""  # TODO: set Jira project key

# Issue Hierarchy Configuration
#   spec.md          -> Epic
#   tasks.md Phase   -> Story   (child of Epic)
#   tasks.md T### item -> Sub-task (child of Story)
hierarchy:
  epic_type: "Epic"
  story_type: "Story"
  task_type: "Sub-task"   # exact name verified against the project's issue types

  # Options: "Parent", "Epic Link", "Relates", "Blocks", "Implements", "is child of", "none"
  relationships:
    epic_story: "Parent"  # Story.parent = Epic (works for team- and company-managed on Jira Cloud)
    story_task: "Parent"  # Sub-task.parent = Story (required for sub-tasks)
    epic_task: "none"     # Sub-tasks inherit the Epic through their parent Story

# Default Values for Issue Creation
defaults:
  epic:
    labels: ["speckit"]
    custom_fields: {}
  story:
    labels: ["speckit"]
    custom_fields: {}
  task:
    labels: ["speckit"]
    custom_fields: {}

# Field Mappings (discovered via /speckit-jira-discover-fields)
field_mappings: {}

# Status Mapping for sync-status command
status_mapping:
  completed: "Done"           # [x] in tasks.md
  pending: "To Do"            # [ ] in tasks.md
  in_progress: "In Progress"  # [~] in tasks.md (optional)

# Environment Variable Overrides:
# - SPECKIT_JIRA_MCP_SERVER
# - SPECKIT_JIRA_PROJECT_KEY
# - SPECKIT_JIRA_EPIC_TYPE
# - SPECKIT_JIRA_STORY_TYPE
# - SPECKIT_JIRA_TASK_TYPE
# - SPECKIT_JIRA_EPIC_STORY_RELATIONSHIP
# - SPECKIT_JIRA_STORY_TASK_RELATIONSHIP
# - SPECKIT_JIRA_EPIC_TASK_RELATIONSHIP
